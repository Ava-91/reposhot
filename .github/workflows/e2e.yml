name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test @axe-core/playwright
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - run: npx --yes playwright@1.55.0 test
